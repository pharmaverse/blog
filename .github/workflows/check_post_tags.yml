name: Check post tags

# Pull requests: only posts the PR adds or modifies are checked (all posts if
# the allowed tags or the check itself change). main / manual: every post is
# checked and failures are reported in an issue.

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  Check-post-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Select posts to check
        id: files
        uses: ./.github/actions/target-files
        with:
          pattern: '^posts/.*\.qmd$'
          full-check-trigger: '^R/(allowed_tags|check_post_tags)\.R$'
      - name: Set up R
        if: steps.files.outputs.count != '0'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        if: steps.files.outputs.count != '0'
        run: install.packages(c("rmarkdown", "cli"))
        shell: Rscript {0}
      - name: Run check_post_tags
        if: steps.files.outputs.count != '0'
        env:
          TARGET_FILES: ${{ steps.files.outputs.file }}
        run: source("R/check_post_tags.R")
        shell: Rscript {0}
      - name: Report full-run result in an issue
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/report-to-issue
        with:
          check-name: Post tags
          status: ${{ job.status }}
