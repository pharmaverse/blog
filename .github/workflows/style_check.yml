name: Style
on:
  pull_request: {branches: ['main']}

jobs:
  Style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      - name: Install styler
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::styler
      - name: styler version
        run: packageVersion("styler")
        shell: Rscript {0}
      - name: Run styler
        run: styler::style_dir(dry = "fail")
        shell: Rscript {0}
