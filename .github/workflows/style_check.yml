name: Style

# Pull requests: only R code files the PR adds or modifies are checked.
# main / manual: the whole repository is checked and failures are reported in
# an issue.

on:
  pull_request: {branches: ['main']}
  push: {branches: ['main']}
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  Style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Select files to check
        id: files
        uses: ./.github/actions/target-files
        with:
          # The file types styler::style_dir() checks by default.
          pattern: '\.([Rr]|Rprofile|[Rr]md|[Rr]markdown|[Rr]nw|[Qq]md)$'
      - name: Set up R
        if: steps.files.outputs.count != '0'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install styler
        if: steps.files.outputs.count != '0'
        run: install.packages("styler")
        shell: Rscript {0}
      - name: styler version
        if: steps.files.outputs.count != '0'
        run: packageVersion("styler")
        shell: Rscript {0}
      - name: Run styler
        if: steps.files.outputs.count != '0'
        env:
          MODE: ${{ steps.files.outputs.mode }}
          LIST: ${{ steps.files.outputs.file }}
        run: |
          if (Sys.getenv("MODE") == "all") {
            styler::style_dir(dry = "fail")
          } else {
            styler::style_file(readLines(Sys.getenv("LIST")), dry = "fail")
          }
        shell: Rscript {0}
      - name: Report full-run result in an issue
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/report-to-issue
        with:
          check-name: Style
          status: ${{ job.status }}
