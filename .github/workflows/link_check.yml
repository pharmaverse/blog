name: Links (Fail Fast)

on:
  pull_request:
    branches:
      - main

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so changed-files can diff against the base

      # Only check links in files touched by this PR, so unrelated link rot in
      # older posts can't block an unrelated contribution.
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.qmd
            **/*.md

      - name: Set up R  # Install R from CRAN
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3' # You can specify a different R version if needed

      - name: Install R packages
        run: |
          Rscript -e 'install.packages("fs")'
        shell: bash

      - name: Switch .qmd to .md
        run: Rscript R/switch.R
        shell: bash

      # switch.R renames every .qmd to .md, so remap the changed .qmd paths
      # to their .md counterparts before handing them to lychee.
      - name: Build list of changed files to check
        id: targets
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          targets=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" \
            | tr ' ' '\n' \
            | sed 's/\.qmd$/.md/' \
            | tr '\n' ' ')
          echo "files=${targets}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Link Checker
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v1.8.0
        with:
          args: --verbose --no-progress ${{ steps.targets.outputs.files }}
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
