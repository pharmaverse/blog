name: Links (Fail Fast)

on:
  pull_request:
    branches:
      - main

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R  # Install R from CRAN
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3' # You can specify a different R version if needed

      - name: Install R packages
        run: |
          Rscript -e 'install.packages("fs")'
        shell: bash

      - name: Switch .qmd to .md
        run: Rscript R/switch.R
        shell: bash

      - name: Link Checker
        uses: lycheeverse/lychee-action@v1.8.0
        with:
          fail: true
          # github.com rate-limits the runner with transient 503s when hundreds of
          # links are checked at once; accept 429/503 and lower concurrency
          args: >-
            --verbose --no-progress
            --accept 200,201,202,203,204,206,429,503
            --max-concurrency 16
            './**/*.md' './**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
